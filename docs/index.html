<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfflineVideos</title>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--fg:#24211d;--muted:#6a645b;--line:#ddd3c4;--accent:#8a6a3b;--accent-soft:#efe2cf}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f19;--fg:#f1e9dc;--muted:#a79f93;--line:#3a352d;--accent:#c7a46a;--accent-soft:#33291f}}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px}
header{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
h1{font-size:32px;margin:0}p{margin:0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.filter{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;transition:.2s ease}
button.filter:hover{border-color:var(--accent);color:var(--accent)}
button.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search{flex:1;min-width:220px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06);transition:.2s ease}
.card:hover{transform:translateY(-2px)}.card-link{display:block;color:inherit;text-decoration:none}.card-link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{aspect-ratio:16/9;background:#d8d1c6;display:block;width:100%;object-fit:cover}
.body{padding:14px}.title{font-size:15px;line-height:1.45;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;margin-bottom:8px}.empty{padding:48px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>OfflineVideos</h1>
<p id="meta">読み込み中…</p>
<div class="controls">
<button class="filter active" data-source="all">すべて</button>
<button class="filter" data-source="youtube">YouTube</button>
<button class="filter" data-source="bilibili">Bilibili</button>
<input class="search" id="search" placeholder="タイトル検索">
</div>
</header>
<div id="grid" class="grid"></div>
</div>
<script>
let items=[];
async function load(){
 const r=await fetch('data/catalog.json?t='+Date.now(), {cache:'no-store'});
 if(!r.ok){document.getElementById('meta').textContent='カタログを読み込めませんでした';return;}
 const data=await r.json();
 items=data.items||[];
 const updated=data.updated_at?new Date(data.updated_at).toLocaleString('ja-JP'):'不明';
 document.getElementById('meta').textContent=`更新: ${updated} / ${items.length}件`;
 render();
}
function render(){
 const source=document.querySelector('.filter.active')?.dataset.source||'all';
 const q=document.getElementById('search').value.trim().toLowerCase();
 const filtered=items.filter(v=>{
   if(source!=='all' && v.source!==source) return false;
   if(q && !(v.title||'').toLowerCase().includes(q)) return false;
   return true;
 });
 const grid=document.getElementById('grid');
 if(!filtered.length){grid.innerHTML='<div class="empty">動画がありません</div>';return;}
 grid.innerHTML=filtered.map(v=>{
   const thumb=v.thumbnail_file?`data/${v.thumbnail_file}`:'';
   const href=safeVideoURL(v.source_url);
   const card=`<img class="thumb" loading="lazy" src="${escape(thumb)}" alt=""><div class="body"><span class="badge">${escape(v.source)}</span><h2 class="title">${escape(v.title)}</h2><div class="meta"><span>${escape(v.uploader||v.channel||'')}</span><span>${formatDuration(v.duration_seconds)}</span></div></div>`;
   return `<article class="card">${href?`<a class="card-link" href="${escape(href)}" target="_blank" rel="noopener noreferrer" aria-label="${escape(v.title)} を元の動画サイトで開く">${card}</a>`:card}</article>`;
 }).join('');
}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}));
document.getElementById('search').addEventListener('input',render);
function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeVideoURL(s){try{const u=new URL(s);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}
function formatDuration(s){if(!s)return '';const m=Math.floor(s/60);const r=Math.floor(s%60);return `${m}:${String(r).padStart(2,'0')}`}
load();
</script>
</body>
</html>
