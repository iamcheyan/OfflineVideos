<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfflineVideos</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf7;--fg:#24211d;--muted:#6a645b;--line:#ddd4c5;--accent:#8a6a3b}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f19;--fg:#f1e9dc;--muted:#a79f93;--line:#3a352d;--accent:#c7a46a}}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:28px;margin:0 0 4px}p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.thumb{aspect-ratio:16/9;background:#ccc;display:block;width:100%;object-fit:cover}
.body{padding:12px}.title{font-size:15px;line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>OfflineVideos</h1>
<p id="meta">読み込み中…</p>
<div id="grid" class="grid"></div>
</div>
<script>
async function load(){
 let data=null;
 try{const r=await fetch('data/catalog.json');if(r.ok)data=await r.json();}catch(e){}
 if(!data){document.getElementById('meta').textContent='カタログを読み込めませんでした';return;}
 const items=data.items||[];
 const updated=data.updated_at?new Date(data.updated_at).toLocaleString('ja-JP'):'不明';
 document.getElementById('meta').textContent=`更新: ${updated} / ${items.length}件`;
 const grid=document.getElementById('grid');
 if(!items.length){grid.innerHTML='<div class="empty">動画がありません</div>';return;}
 grid.innerHTML=items.map(v=>`<article class="card"><img class="thumb" loading="lazy" src="${v.thumbnail_file?'/data/'+v.thumbnail_file:v.thumbnail_url||''}" alt=""><div class="body"><h2 class="title">${escape(v.title)}</h2><div class="meta"><span>${escape(v.source)}</span><span>${formatDuration(v.duration_seconds)}</span></div></div></article>`).join('');
}
function escape(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function formatDuration(s){if(!s)return '';const m=Math.floor(s/60);const r=Math.floor(s%60);return `${m}:${String(r).padStart(2,'0')}`}
load();
</script>
</body>
</html>
